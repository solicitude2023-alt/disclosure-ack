<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Disclosure Acknowledged</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 500px;
      text-align: center;
    }
    .checkmark { font-size: 48px; }
    h1 { color: #2d6a4f; font-size: 24px; margin: 16px 0 8px; }
    p { color: #555; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="checkmark">✅</div>
    <h1>Disclosure Acknowledged</h1>
    <p>Thank you. Your disclosure has been acknowledged. A member of our team will be in touch with you shortly.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const leadId = params.get('lead_id');
    if (leadId) {
      fetch(
        'https://godwillprovide.app.n8n.cloud/webhook/wf08-ack?lead_id=' + encodeURIComponent(leadId),
        { method: 'GET', mode: 'no-cors' }
      );
    }
  </script>
</body>
</html>
